name: Publish Release APK

# Runs ONLY when you publish a GitHub Release — never on ordinary pushes/small
# changes. That is what notifies existing users an update is available.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read release version from the tag (e.g. v1.1.0 -> 1.1.0)
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag || '1.0.0' }}}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Stamp this version into the app
        run: |
          sed -i "s/CURRENT_VERSION = '.*'/CURRENT_VERSION = '${{ steps.ver.outputs.version }}'/" src/config/appVersion.js
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${{ steps.ver.outputs.version }}\"/" app.json

      - name: Install packages
        run: |
          npm install
          npx expo install --fix

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Same real King X keystore as the dev builds (build-apk.yml) — this
      # must match exactly, or a release install conflicts with a dev
      # install instead of updating it, and Google Sign-In only works for
      # whichever one's SHA-1 is actually registered in Firebase.
      - name: Restore King X release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/kingx-release.keystore
          test -s android/app/kingx-release.keystore
          keytool -list -keystore android/app/kingx-release.keystore -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD"

      - name: Configure King X release signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          release_config = """
                  release {
                      storeFile file("kingx-release.keystore")
                      storePassword System.getenv("KINGX_STORE_PASSWORD")
                      keyAlias System.getenv("KINGX_KEY_ALIAS")
                      keyPassword System.getenv("KINGX_KEY_PASSWORD")
                  }
          """

          match = re.search(r'\bsigningConfigs\s*\{', text)

          if match:
              start = match.start()
              opening = text.find("{", start)
              depth = 0
              end = None
              for i in range(opening, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise RuntimeError("Could not find end of signingConfigs block")

              block = text[start:end]
              block = re.sub(r'\brelease\s*\{.*?\}', '', block, flags=re.DOTALL)
              block = block[:-1] + release_config + "\n}"
              text = text[:start] + block + text[end:]
          else:
              android_match = re.search(r'\bandroid\s*\{', text)
              if not android_match:
                  raise RuntimeError("Could not find android block")
              insert_at = android_match.end()
              signing = """

              signingConfigs {
                  release {
                      storeFile file("kingx-release.keystore")
                      storePassword System.getenv("KINGX_STORE_PASSWORD")
                      keyAlias System.getenv("KINGX_KEY_ALIAS")
                      keyPassword System.getenv("KINGX_KEY_PASSWORD")
                  }
              }
              """
              text = text[:insert_at] + signing + text[insert_at:]

          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          path.write_text(text)
          print("King X release signing configured.")
          PY

      - name: Build release APK
        env:
          KINGX_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KINGX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KINGX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk chat-app-${{ steps.ver.outputs.version }}.apk

      - name: Attach the APK to this GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: chat-app-${{ steps.ver.outputs.version }}.apk

      - name: Notify everyone in the app (Firestore config/appVersion)
        if: github.event_name == 'release'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/chat-app-${{ steps.ver.outputs.version }}.apk
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          npm install firebase-admin@12 --no-save
          node .github/scripts/publish-version.js

      - name: Cleanup signing key
        if: always()
        run: rm -f android/app/kingx-release.keystore
