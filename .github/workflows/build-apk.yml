name: Build King X APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # IMPORTANT:
      # Install the exact Expo SDK used by King X first.
      - name: Install Expo SDK 52
        run: |
          npm install expo@52.0.46 --save-exact


      - name: Install project dependencies
        run: |
          npm install


      # --------------------------------------------------
      # Diagnose the Expo installation BEFORE prebuild
      # --------------------------------------------------
      - name: Verify Expo installation
        run: |
          echo "===== Expo ====="
          node -p "require('expo/package.json').version"

          echo ""
          echo "===== React Native ====="
          node -p "require('react-native/package.json').version"

          echo ""
          echo "===== Expo Modules Autolinking ====="
          node -p "require('expo-modules-autolinking/package.json').version"

          echo ""
          echo "===== Expo Modules Core ====="
          node -p "require('expo-modules-core/package.json').version"

          echo ""
          echo "===== Screen Orientation ====="
          node -p "require('expo-screen-orientation/package.json').version"

          echo ""
          echo "===== Expo Gradle Plugin ====="
          PLUGIN="node_modules/expo-modules-autolinking/android/expo-gradle-plugin"

          if [ -d "$PLUGIN" ]; then
            echo "FOUND: $PLUGIN"
            ls -la "$PLUGIN"
          else
            echo "ERROR: Expo Gradle plugin was NOT found."
            exit 1
          fi


      # --------------------------------------------------
      # Restore Firebase
      # --------------------------------------------------
      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"

          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json

          test -s google-services.json


      # --------------------------------------------------
      # Generate native Android project
      # --------------------------------------------------
      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --clean \
            --no-install


      # --------------------------------------------------
      # Verify Expo Gradle plugin was linked
      # --------------------------------------------------
      - name: Verify generated Gradle configuration
        run: |
          echo "===== settings.gradle ====="
          cat android/settings.gradle

          echo ""
          echo "===== Expo Gradle plugin references ====="

          if grep -R "expo-gradle-plugin" android/settings.gradle; then
            echo "Expo Gradle plugin is linked."
          else
            echo "ERROR: Expo Gradle plugin is NOT linked."
            exit 1
          fi


      # --------------------------------------------------
      # Remove Firebase secret source
      # --------------------------------------------------
      - name: Remove Firebase source file
        run: |
          rm -f google-services.json


      # --------------------------------------------------
      # Restore signing keystore
      # --------------------------------------------------
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/kingx-release.keystore

          test -s android/app/kingx-release.keystore


      # --------------------------------------------------
      # Configure signing
      # --------------------------------------------------
      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF

          MYAPP_UPLOAD_STORE_FILE=kingx-release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF


      # --------------------------------------------------
      # Configure release signing
      # --------------------------------------------------
      - name: Configure release signing
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "MYAPP_UPLOAD_STORE_FILE" not in text:
              signing = """
          signingConfigs {
              release {
                  if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                      storeFile file(MYAPP_UPLOAD_STORE_FILE)
                      storePassword MYAPP_UPLOAD_STORE_PASSWORD
                      keyAlias MYAPP_UPLOAD_KEY_ALIAS
                      keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                  }
              }
          }

          """

              text = text.replace(
                  "buildTypes {",
                  signing + "buildTypes {",
                  1
              )

          # Only modify the release configuration.
          release_marker = "release {"

          start = text.find(release_marker)

          if start != -1:
              end = text.find("}", start)

              if end != -1:
                  block = text[start:end]

                  if "signingConfig signingConfigs.debug" in block:
                      block = block.replace(
                          "signingConfig signingConfigs.debug",
                          "signingConfig signingConfigs.release"
                      )

                      text = text[:start] + block + text[end:]

          path.write_text(text)
          PY


      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # Verify APK
      # --------------------------------------------------
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "APK generated successfully:"
          ls -lh "$APK"


      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: King-X-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error