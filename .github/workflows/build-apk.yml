name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Restore King X release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/kingx-release.keystore

          test -s android/app/kingx-release.keystore

          echo "Keystore restored successfully."

          keytool -list \
            -keystore android/app/kingx-release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD"

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF
          KINGX_STORE_FILE=kingx-release.keystore
          KINGX_STORE_PASSWORD=$STORE_PASSWORD
          KINGX_KEY_ALIAS=$KEY_ALIAS
          KINGX_KEY_PASSWORD=$KEY_PASSWORD
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file(KINGX_STORE_FILE)
                      storePassword KINGX_STORE_PASSWORD
                      keyAlias KINGX_KEY_ALIAS
                      keyPassword KINGX_KEY_PASSWORD
                  }
              }
          """

          if "KINGX_STORE_FILE" not in text:
              text = text.replace(
                  "android {",
                  "android {" + signing_config,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release"
              )

          if "signingConfig signingConfigs.release" not in text:
              marker = "buildTypes {"

              replacement = """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              """

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          path.write_text(text)
          PY

      - name: Verify release signing configuration
        run: |
          echo "Checking Gradle signing configuration..."

          grep -n "KINGX_STORE_FILE" android/app/build.gradle
          grep -n "signingConfig signingConfigs.release" android/app/build.gradle

      - name: Check release SHA-1
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/kingx-release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" |
            grep -E "SHA1:|SHA256:"

      - name: Check Expo bundle
        run: |
          npx expo export \
            --platform android \
            --output-dir /tmp/expo-check

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK exists
        run: |
          ls -lh android/app/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: king-x-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Cleanup signing key
        if: always()
        run: |
          rm -f android/app/kingx-release.keystore