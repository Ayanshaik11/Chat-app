
name: Build Android APK

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: |
          npm install
          npx expo install --fix

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Fixed signing key so the SHA-1 never changes (add it once in Firebase)
      - name: Use fixed signing key
        run: |
          echo "" | base64 -d > android/app/debug.keystore
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA256"

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chat-app-apk
          path: android/app/build/outputs/apk/release/*.apk
