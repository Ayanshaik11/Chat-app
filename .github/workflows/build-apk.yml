name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Install dependencies
        run: npm install


      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install


      - name: Restore King X release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode >
            android/app/kingx-release.keystore

          test -s android/app/kingx-release.keystore

          echo "Keystore restored successfully."

          keytool -list \
            -keystore android/app/kingx-release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD"


      - name: Configure King X release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          marker = "signingConfigs {"

          signing = '''
              signingConfigs {
                  release {
                      storeFile file("kingx-release.keystore")
                      storePassword System.getenv("KINGX_STORE_PASSWORD")
                      keyAlias System.getenv("KINGX_KEY_ALIAS")
                      keyPassword System.getenv("KINGX_KEY_PASSWORD")
                  }
              }
          '''

          if marker not in text:
              text = text.replace(
                  "android {",
                  "android {" + signing,
                  1
              )

          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          path.write_text(text)
          PY

          echo "Release signing configuration added."


      - name: Verify signing configuration
        env:
          KINGX_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KINGX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KINGX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Checking signing configuration..."

          grep -n "kingx-release.keystore" \
            android/app/build.gradle

          grep -n "signingConfigs.release" \
            android/app/build.gradle

          test -f android/app/kingx-release.keystore

          echo "Signing configuration looks good."


      - name: Check release SHA-1
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/kingx-release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" |
            grep -E "SHA1:|SHA256:"


      - name: Check Expo bundle
        run: |
          npx expo export \
            --platform android \
            --output-dir /tmp/expo-check


      - name: Build release APK
        env:
          KINGX_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KINGX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KINGX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleRelease --no-daemon


      - name: Verify APK exists
        run: |
          ls -lh \
            android/app/build/outputs/apk/release/*.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: king-x-release-apk
          path: android/app/build/outputs/apk/release/*.apk


      - name: Cleanup signing key
        if: always()
        run: |
          rm -f android/app/kingx-release.keystore