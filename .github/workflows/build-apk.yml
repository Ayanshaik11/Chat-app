name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. NODE
      # ==================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==================================================
      # 3. JAVA
      # ==================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ==================================================
      # 4. INSTALL NPM DEPENDENCIES
      # ==================================================

      - name: Install npm dependencies
        run: |
          npm install


      # ==================================================
      # 5. ALIGN EXPO DEPENDENCIES
      # ==================================================

      - name: Fix Expo dependency versions
        run: |
          npx expo install --fix


      # ==================================================
      # 6. SHOW INSTALLED VERSIONS
      # ==================================================

      - name: Show installed React Navigation versions
        run: |
          echo "=========================================="
          echo "React Navigation versions"
          echo "=========================================="

          npm ls @react-navigation/native \
            @react-navigation/bottom-tabs \
            @react-navigation/native-stack \
            react-native-screens \
            react-native-safe-area-context \
            --depth=0 || true

          echo ""
          echo "=========================================="
          echo "Expo / React / React Native versions"
          echo "=========================================="

          npm ls expo \
            react \
            react-native \
            --depth=0 || true


      # ==================================================
      # 7. VERIFY EXPO
      # ==================================================

      - name: Check Expo dependencies
        run: |
          npx expo-doctor || echo "expo-doctor reported warnings above — continuing anyway."


      # ==================================================
      # 8. GENERATE ANDROID PROJECT
      # ==================================================

      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --no-install


      # ==================================================
      # 9. RESTORE RELEASE KEYSTORE
      # ==================================================

      - name: Restore King X release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/kingx-release.keystore

          test -s android/app/kingx-release.keystore

          echo "Keystore restored successfully."

          keytool -list \
            -keystore android/app/kingx-release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD"


      # ==================================================
      # 10. CONFIGURE RELEASE SIGNING
      # ==================================================

      - name: Configure King X release signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          release_config = """
                  release {
                      storeFile file("kingx-release.keystore")
                      storePassword System.getenv("KINGX_STORE_PASSWORD")
                      keyAlias System.getenv("KINGX_KEY_ALIAS")
                      keyPassword System.getenv("KINGX_KEY_PASSWORD")
                  }
          """

          # ------------------------------------------------
          # Find signingConfigs
          # ------------------------------------------------

          match = re.search(
              r'\bsigningConfigs\s*\{',
              text
          )

          if match:
              start = match.start()
              opening = text.find("{", start)

              depth = 0
              end = None

              for i in range(opening, len(text)):
                  if text[i] == "{":
                      depth += 1

                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise RuntimeError(
                      "Could not find end of signingConfigs block"
                  )

              block = text[start:end]

              # Remove existing release block.
              block = re.sub(
                  r'\brelease\s*\{.*?\}',
                  '',
                  block,
                  flags=re.DOTALL
              )

              # Add our release block.
              block = block[:-1] + release_config + "\n}"

              text = text[:start] + block + text[end:]

          else:
              # No signingConfigs block exists.
              android_match = re.search(
                  r'\bandroid\s*\{',
                  text
              )

              if not android_match:
                  raise RuntimeError(
                      "Could not find android block"
                  )

              insert_at = android_match.end()

              signing = """

              signingConfigs {
                  release {
                      storeFile file("kingx-release.keystore")
                      storePassword System.getenv("KINGX_STORE_PASSWORD")
                      keyAlias System.getenv("KINGX_KEY_ALIAS")
                      keyPassword System.getenv("KINGX_KEY_PASSWORD")
                  }
              }
              """

              text = (
                  text[:insert_at]
                  + signing
                  + text[insert_at:]
              )

          # ------------------------------------------------
          # Use release signing
          # ------------------------------------------------

          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          path.write_text(text)

          print("King X release signing configured.")
          PY


      # ==================================================
      # 11. VERIFY SIGNING
      # ==================================================

      - name: Verify signing configuration
        run: |
          echo "Checking keystore..."

          test -f android/app/kingx-release.keystore

          echo "Checking signing configuration..."

          grep -n "kingx-release.keystore" \
            android/app/build.gradle

          grep -n "signingConfigs.release" \
            android/app/build.gradle

          echo "Signing configuration looks good."


      # ==================================================
      # 12. CHECK SHA-1
      # ==================================================

      - name: Check release SHA-1
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/kingx-release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:"


      # ==================================================
      # 13. CHECK EXPO BUNDLE
      # ==================================================

      - name: Check Expo bundle
        run: |
          npx expo export \
            --platform android \
            --output-dir /tmp/expo-check


      # ==================================================
      # 14. BUILD RELEASE APK
      # ==================================================

      - name: Build release APK
        env:
          KINGX_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KINGX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KINGX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon


      # ==================================================
      # 15. VERIFY APK
      # ==================================================

      - name: Verify APK exists
        run: |
          echo "Searching for APK..."

          ls -lh \
            android/app/build/outputs/apk/release/*.apk


      # ==================================================
      # 16. UPLOAD APK
      # ==================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: king-x-release-apk
          path: android/app/build/outputs/apk/release/*.apk


      # ==================================================
      # 17. CLEANUP
      # ==================================================

      - name: Cleanup signing key
        if: always()
        run: |
          rm -f android/app/kingx-release.keystore

          echo "Signing key cleaned up."