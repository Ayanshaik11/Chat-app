name: Build King X APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm ci


      # ============================================================
      # EXPO DEPENDENCY CHECK
      # ============================================================

      - name: Verify Expo dependencies
        run: npx expo install --check


      # ============================================================
      # EXPO DOCTOR
      # ============================================================

      - name: Run Expo Doctor
        run: npx expo-doctor


      # ============================================================
      # RESTORE FIREBASE GOOGLE SERVICES
      # ============================================================

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 is empty."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode > google-services.json

          echo ""
          echo "Firebase file restored."

          echo ""
          echo "Validating JSON..."

          python3 -m json.tool google-services.json > /dev/null

          echo "Firebase JSON syntax: PASS"

          python3 - <<'PY'
          import json

          path = "google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if "client" not in data:
              raise SystemExit(
                  "ERROR: Missing client field."
              )

          if not isinstance(data["client"], list):
              raise SystemExit(
                  "ERROR: client is not an array."
              )

          if not data["client"]:
              raise SystemExit(
                  "ERROR: client array is empty."
              )

          print("Firebase JSON structure: PASS")
          print("Client entries:", len(data["client"]))

          found = False

          for client in data["client"]:

              info = client.get(
                  "client_info",
                  {}
              )

              package_name = (
                  info
                  .get(
                      "android_client_info",
                      {}
                  )
                  .get(
                      "package_name"
                  )
              )

              print(
                  "Firebase Android package:",
                  package_name
              )

              if package_name == "com.chat.app":
                  found = True

          if not found:
              raise SystemExit(
                  "ERROR: Firebase JSON does not contain "
                  "package com.chat.app"
              )

          print(
              "Firebase Android package verification: PASS"
          )
          PY


      # ============================================================
      # GENERATE ANDROID PROJECT
      # ============================================================

      - name: Generate Android project
        run: |
          set -e

          npx expo prebuild \
            --platform android \
            --clean \
            --no-install


      # ============================================================
      # VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        run: |
          set -e

          test -f android/gradlew

          test -f android/app/build.gradle

          test -f android/app/google-services.json

          echo ""
          echo "Android project verified."

          echo "Firebase configuration copied successfully."


      # ============================================================
      # REMOVE ROOT FIREBASE FILE
      # ============================================================

      - name: Remove root Firebase source file
        run: |
          set -e

          rm -f google-services.json

          test ! -f google-services.json

          echo ""
          echo "Root Firebase source file removed."


      # ============================================================
      # RESTORE RELEASE KEYSTORE
      # ============================================================

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > android/app/kingx-release.keystore

          test -s android/app/kingx-release.keystore

          echo ""
          echo "Release keystore restored."

          echo ""
          echo "Keystore size:"

          ls -lh android/app/kingx-release.keystore


      # ============================================================
      # CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          text = path.read_text()

          print("Configuring Android release signing...")

          android_start = text.find("android {")

          if android_start == -1:
              raise SystemExit(
                  "ERROR: android { block was not found."
              )


          def find_matching_brace(source, opening):

              depth = 0

              in_string = False

              string_char = None

              escape = False

              for i in range(
                  opening,
                  len(source)
              ):

                  char = source[i]

                  if in_string:

                      if escape:
                          escape = False

                      elif char == "\\":
                          escape = True

                      elif char == string_char:
                          in_string = False

                      continue


                  if char in ('"', "'"):

                      in_string = True

                      string_char = char

                      continue


                  if char == "{":

                      depth += 1


                  elif char == "}":

                      depth -= 1

                      if depth == 0:
                          return i


              return -1


          android_end = find_matching_brace(
              text,
              android_start
          )

          if android_end == -1:
              raise SystemExit(
                  "ERROR: Could not determine end of android block."
              )


          android_block = text[
              android_start:
              android_end + 1
          ]


          # Remove an old kingxRelease signing block
          old_signing = re.compile(
              r'\n\s*signingConfigs\s*\{\s*'
              r'kingxRelease\s*\{.*?\}\s*'
              r'\}\s*',
              re.DOTALL
          )

          android_block = old_signing.sub(
              "\n",
              android_block
          )


          # Add our release signing configuration
          signing_config = '''
              signingConfigs {
                  kingxRelease {
                      storeFile file("kingx-release.keystore")
                      storePassword System.getenv("KINGX_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KINGX_KEY_ALIAS")
                      keyPassword System.getenv("KINGX_KEY_PASSWORD")
                  }
              }

          '''


          android_open_end = (
              android_block.find("{") + 1
          )


          android_block = (
              android_block[:android_open_end]
              + "\n"
              + signing_config
              + android_block[android_open_end:]
          )


          # Find buildTypes
          build_types_start = android_block.find(
              "buildTypes {"
          )

          if build_types_start == -1:
              raise SystemExit(
                  "ERROR: buildTypes { block was not found."
              )


          build_types_end = find_matching_brace(
              android_block,
              build_types_start
          )

          if build_types_end == -1:
              raise SystemExit(
                  "ERROR: Could not determine end "
                  "of buildTypes block."
              )


          build_types_block = android_block[
              build_types_start:
              build_types_end + 1
          ]


          # Find release block
          release_start = build_types_block.find(
              "release {"
          )

          if release_start == -1:
              raise SystemExit(
                  "ERROR: release { block was not found."
              )


          release_end = find_matching_brace(
              build_types_block,
              release_start
          )

          if release_end == -1:
              raise SystemExit(
                  "ERROR: Could not determine end "
                  "of release block."
              )


          release_block = build_types_block[
              release_start:
              release_end + 1
          ]


          # Remove any existing signingConfig
          release_block = re.sub(
              r'^\s*signingConfig\s+.*$',
              "",
              release_block,
              flags=re.MULTILINE
          )


          # Add our release signing config
          release_open_end = (
              release_block.find("{") + 1
          )


          release_block = (
              release_block[:release_open_end]
              + '''
                  signingConfig signingConfigs.kingxRelease
              '''
              + release_block[release_open_end:]
          )


          build_types_block = (
              build_types_block[:release_start]
              + release_block
              + build_types_block[release_end + 1:]
          )


          android_block = (
              android_block[:build_types_start]
              + build_types_block
              + android_block[build_types_end + 1:]
          )


          text = (
              text[:android_start]
              + android_block
              + text[android_end + 1:]
          )


          path.write_text(text)

          print(
              "Release signing configuration completed."
          )
          PY


          echo ""
          echo "=========================================="
          echo "       VERIFY GRADLE SIGNING CONFIG"
          echo "=========================================="


          grep -n -A12 -B3 \
            "kingxRelease" \
            android/app/build.gradle || true


          echo ""
          echo "=========================================="
          echo "       VERIFY RELEASE SIGNING LINE"
          echo "=========================================="


          grep -n \
            "signingConfig signingConfigs.kingxRelease" \
            android/app/build.gradle


      # ============================================================
      # PREPARE GRADLE
      # ============================================================

      - name: Prepare Gradle
        working-directory: android

        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version


      # ============================================================
      # TEST JAVASCRIPT BUNDLE
      # ============================================================

      - name: Test JavaScript bundle
        run: |
          set -e

          npx expo export \
            --platform android


      # ============================================================
      # BUILD RELEASE APK
      # ============================================================

      - name: Build release APK
        working-directory: android

        env:
          KINGX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

          KINGX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

          KINGX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
            -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

        run: |
          set -e

          set -o pipefail

          echo ""
          echo "=========================================="
          echo "       STARTING RELEASE APK BUILD"
          echo "=========================================="

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --max-workers=2 \
            2>&1 | tee ../gradle-build.log


      # ============================================================
      # VERIFY APK SIGNING
      # ============================================================

      - name: Verify APK signing certificate
        working-directory: android

        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          KEYSTORE="app/kingx-release.keystore"


          echo ""
          echo "=========================================="
          echo "       CHECK APK"
          echo "=========================================="


          if [ ! -f "$APK" ]; then

            echo "ERROR: APK does not exist."

            exit 1

          fi


          ls -lh "$APK"


          echo ""
          echo "=========================================="
          echo "       CHECK KEYSTORE"
          echo "=========================================="


          if [ ! -f "$KEYSTORE" ]; then

            echo "ERROR: Keystore does not exist."

            exit 1

          fi


          ls -lh "$KEYSTORE"


          echo ""
          echo "=========================================="
          echo "       KEYSTORE CERTIFICATE"
          echo "=========================================="


          keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"


          echo ""
          echo "=========================================="
          echo "       FIND APKSIGNER"
          echo "=========================================="


          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -name apksigner \
              -type f \
              | sort -V \
              | tail -1
          )


          if [ -z "$APKSIGNER" ]; then

            echo "ERROR: apksigner not found."

            exit 1

          fi


          echo "Using:"

          echo "$APKSIGNER"


          echo ""
          echo "=========================================="
          echo "       ACTUAL APK CERTIFICATE"
          echo "=========================================="


          CERT_OUTPUT=$(
            "$APKSIGNER" verify \
              --verbose \
              --print-certs \
              "$APK" 2>&1
          )


          echo "$CERT_OUTPUT"


          echo ""
          echo "=========================================="
          echo "       RELEASE CERTIFICATE CHECK"
          echo "=========================================="


          # Expected SHA-1 without colons.
          #
          # Keystore:
          #
          # B8:65:D4:6C:C3:65:C7:B1:EE:66:03:0B:
          # 52:47:1E:33:D0:08:11:B7
          #
          # Normalized:
          #
          # b865d46cc365c7b1ee66030b52471e33d00811b7

          EXPECTED_SHA1="b865d46cc365c7b1ee66030b52471e33d00811b7"


          ACTUAL_SHA1=$(
            echo "$CERT_OUTPUT" |
            grep -i \
              "certificate SHA-1 digest:" |
            sed \
              's/.*certificate SHA-1 digest: //' |
            tr -d '[:space:]' |
            tr '[:upper:]' '[:lower:]'
          )


          echo ""
          echo "Expected SHA-1:"
          echo "$EXPECTED_SHA1"


          echo ""
          echo "Actual APK SHA-1:"
          echo "$ACTUAL_SHA1"


          # Make sure an SHA-1 was actually found.
          if [ -z "$ACTUAL_SHA1" ]; then

            echo ""
            echo "ERROR: Could not read APK SHA-1."

            exit 1

          fi


          # Check for debug certificate.
          if echo "$CERT_OUTPUT" |
            grep -qi \
            "certificate DN: CN=Android Debug"; then

            echo ""
            echo "ERROR: APK IS SIGNED WITH ANDROID DEBUG CERTIFICATE."

            echo ""
            echo "The release signing configuration was NOT applied."

            echo ""
            echo "Expected release SHA-1:"

            echo "B8:65:D4:6C:C3:65:C7:B1:EE:66:03:0B:52:47:1E:33:D0:08:11:B7"

            exit 1

          fi


          # Compare normalized SHA-1 values.
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then

            echo ""
            echo "ERROR: APK SHA-1 DOES NOT MATCH KING X RELEASE KEYSTORE."

            echo ""
            echo "Expected:"
            echo "$EXPECTED_SHA1"

            echo ""
            echo "Actual:"
            echo "$ACTUAL_SHA1"

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "       SIGNING VERIFIED"
          echo "=========================================="

          echo ""
          echo "SUCCESS!"

          echo "The APK is correctly signed with the King X release certificate."

          echo ""
          echo "SHA-1:"

          echo "B8:65:D4:6C:C3:65:C7:B1:EE:66:03:0B:52:47:1E:33:D0:08:11:B7"

          echo ""


      # ============================================================
      # FINAL APK VERIFICATION
      # ============================================================

      - name: Verify APK
        run: |
          set -e

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"


          if [ ! -f "$APK_PATH" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "Available output files:"

            find android/app/build/outputs \
              -type f 2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "       KING X APK BUILD SUCCESSFUL"
          echo "=========================================="


          echo ""

          ls -lh "$APK_PATH"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: King-X-release

          path: android/app/build/outputs/apk/release/app-release.apk

          if-no-files-found: error


      # ============================================================
      # UPLOAD GRADLE LOG IF BUILD FAILS
      # ============================================================

      - name: Upload Gradle debug log
        if: failure()

        uses: actions/upload-artifact@v4

        with:
          name: King-X-gradle-debug-log

          path: gradle-build.log

          if-no-files-found: ignore