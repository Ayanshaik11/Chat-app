name: Build King X APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: npm ci


      # ==========================================
      # VERIFY EXPO DEPENDENCIES
      # ==========================================

      - name: Verify Expo dependencies
        run: npx expo install --check


      # ==========================================
      # EXPO DOCTOR
      # ==========================================

      - name: Run Expo Doctor
        run: npx expo-doctor


      # ==========================================
      # RESTORE FIREBASE CONFIGURATION
      # ==========================================

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 is empty."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode > google-services.json

          echo "Firebase file restored."

          python3 -m json.tool google-services.json > /dev/null

          python3 - <<'PY'
          import json

          path = "google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if "client" not in data:
              raise SystemExit("ERROR: Missing client")

          if not isinstance(data["client"], list):
              raise SystemExit("ERROR: client is not an array")

          if not data["client"]:
              raise SystemExit("ERROR: client array is empty")

          print("Firebase JSON validation: PASS")
          print("Client entries:", len(data["client"]))

          found = False

          for client in data["client"]:
              info = client.get("client_info", {})

              package_name = (
                  info
                  .get("android_client_info", {})
                  .get("package_name")
              )

              print("Firebase Android package:", package_name)

              if package_name == "com.chat.app":
                  found = True
                  print("Firebase package verification: PASS")

          if not found:
              raise SystemExit(
                  "ERROR: Firebase JSON does not contain package com.chat.app"
              )
          PY


      # ==========================================
      # GENERATE ANDROID PROJECT
      # ==========================================

      - name: Generate Android project
        run: |
          set -e

          npx expo prebuild \
            --platform android \
            --clean \
            --no-install


      # ==========================================
      # VERIFY ANDROID PROJECT
      # ==========================================

      - name: Verify Android project
        run: |
          set -e

          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/google-services.json

          echo "Android project verified."
          echo "Firebase configuration copied successfully."


      # ==========================================
      # REMOVE ROOT FIREBASE FILE
      # ==========================================

      - name: Remove root Firebase source file
        run: |
          rm -f google-services.json

          test ! -f google-services.json

          echo "Root Firebase source file removed."


      # ==========================================
      # RESTORE RELEASE KEYSTORE
      # ==========================================

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > android/app/kingx-release.keystore

          test -s android/app/kingx-release.keystore

          echo "Release keystore restored."


      # ==========================================
      # CONFIGURE RELEASE SIGNING
      # ==========================================

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          android_marker = "android {"

          if android_marker not in text:
              raise SystemExit(
                  "ERROR: Could not find android block."
              )

          signing_block = '''
              signingConfigs {
                  kingxRelease {
                      storeFile file("kingx-release.keystore")
                      storePassword System.getenv("KINGX_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KINGX_KEY_ALIAS")
                      keyPassword System.getenv("KINGX_KEY_PASSWORD")
                  }
              }

          '''

          if "kingxRelease" not in text:
              text = text.replace(
                  android_marker,
                  android_marker + "\n" + signing_block,
                  1
              )

          release_marker = "release {"

          if release_marker not in text:
              raise SystemExit(
                  "ERROR: Could not find release block."
              )

          if "signingConfig signingConfigs.kingxRelease" not in text:
              text = text.replace(
                  release_marker,
                  release_marker
                  + "\n            signingConfig signingConfigs.kingxRelease",
                  1
              )

          path.write_text(text)

          print("Release signing configuration completed.")
          PY


      # ==========================================
      # PREPARE GRADLE
      # ==========================================

      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew --version


      # ==========================================
      # TEST JAVASCRIPT BUNDLE
      # ==========================================

      - name: Test JavaScript bundle
        run: |
          npx expo export --platform android


      # ==========================================
      # BUILD RELEASE APK
      # ==========================================

      - name: Build release APK
        working-directory: android
        env:
          KINGX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KINGX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KINGX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
            -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

        run: |
          set -e
          set -o pipefail

          echo "Starting release APK build..."

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --max-workers=2 \
            2>&1 | tee ../gradle-build.log


      # ==========================================
      # VERIFY APK SIGNATURE
      # ==========================================

      - name: Verify APK signing certificate
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="app/kingx-release.keystore"

          echo ""
          echo "=========================================="
          echo "       CHECK APK"
          echo "=========================================="

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK does not exist."
            exit 1
          fi

          ls -lh "$APK"

          echo ""
          echo "=========================================="
          echo "       CHECK KEYSTORE"
          echo "=========================================="

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: Keystore does not exist:"
            echo "$KEYSTORE"
            exit 1
          fi

          ls -lh "$KEYSTORE"

          echo ""
          echo "=========================================="
          echo "       KEYSTORE CERTIFICATE"
          echo "=========================================="

          echo "Alias: $KEY_ALIAS"
          echo "Reading keystore..."

          keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo ""
          echo "=========================================="
          echo "       FIND APKSIGNER"
          echo "=========================================="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f \
            | sort -V \
            | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "Using:"
          echo "$APKSIGNER"

          echo ""
          echo "=========================================="
          echo "       ACTUAL APK CERTIFICATE"
          echo "=========================================="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "=========================================="
          echo "       SIGNATURE CHECK COMPLETE"
          echo "=========================================="


      # ==========================================
      # FINAL APK VERIFICATION
      # ==========================================

      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            echo ""

            echo "Available output files:"
            find android/app/build/outputs \
              -type f 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "       KING X APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""

          ls -lh "$APK_PATH"


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: King-X-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


      # ==========================================
      # UPLOAD GRADLE LOG IF BUILD FAILS
      # ==========================================

      - name: Upload Gradle debug log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: King-X-gradle-debug-log
          path: gradle-build.log
          if-no-files-found: ignore