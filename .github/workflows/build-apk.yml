name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Restore King X release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/kingx-release.keystore

      - name: Verify keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/app/kingx-release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD"

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF
          KINGX_STORE_FILE=kingx-release.keystore
          KINGX_STORE_PASSWORD=$STORE_PASSWORD
          KINGX_KEY_ALIAS=$KEY_ALIAS
          KINGX_KEY_PASSWORD=$KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing = r'''
              signingConfigs {
                  release {
                      storeFile file(KINGX_STORE_FILE)
                      storePassword KINGX_STORE_PASSWORD
                      keyAlias KINGX_KEY_ALIAS
                      keyPassword KINGX_KEY_PASSWORD
                  }
              }
          '''

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  "android {" + signing,
                  1
              )

          old = "signingConfig signingConfigs.debug"

          if old in text:
              text = text.replace(
                  old,
                  "signingConfig signingConfigs.release"
              )
          else:
              text = text.replace(
                  "buildTypes {",
                  """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }""",
                  1
              )

          path.write_text(text)
          PY

      - name: Check SHA-1
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/kingx-release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" |
            grep -E "SHA1:|SHA256:"

      - name: Check Expo bundle
        run: npx expo export --platform android --output-dir /tmp/expo-check

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: king-x-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Cleanup signing key
        if: always()
        run: |
          rm -f android/app/kingx-release.keystore
