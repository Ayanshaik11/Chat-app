name: Build King X APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ---------------------------------------------------------
      # 3. Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ---------------------------------------------------------
      # 4. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # 5. Expo dependency check
      # ---------------------------------------------------------
      - name: Verify Expo dependencies
        run: npx expo install --check

      # ---------------------------------------------------------
      # 6. Expo Doctor
      # ---------------------------------------------------------
      - name: Run Expo Doctor
        run: npx expo-doctor

      # ---------------------------------------------------------
      # 7. Restore Firebase configuration
      # ---------------------------------------------------------
      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is empty."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode \
            > android/app/google-services.json

          echo "Validating Firebase JSON..."

          python3 -m json.tool \
            android/app/google-services.json \
            > /dev/null

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if "client" not in data:
              raise SystemExit("ERROR: Missing client")

          if not isinstance(data["client"], list):
              raise SystemExit("ERROR: client is not an array")

          if not data["client"]:
              raise SystemExit("ERROR: client array is empty")

          print("Firebase JSON validation: PASS")
          print("Client entries:", len(data["client"]))
          PY

      # ---------------------------------------------------------
      # 8. Generate Android project
      # ---------------------------------------------------------
      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --clean \
            --no-install

      # ---------------------------------------------------------
      # 9. Verify generated Android project
      # ---------------------------------------------------------
      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle

          echo "Android project verified."

      # ---------------------------------------------------------
      # 10. Remove source Firebase file
      #     The file is restored only inside android/app.
      # ---------------------------------------------------------
      - name: Remove Firebase source file
        run: |
          rm -f google-services.json
          echo "Source Firebase file removed."

      # ---------------------------------------------------------
      # 11. Restore release keystore
      # ---------------------------------------------------------
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/kingx-release.keystore

          test -s android/app/kingx-release.keystore

          echo "Release keystore restored."

      # ---------------------------------------------------------
      # 12. Configure signing properties
      # ---------------------------------------------------------
      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cat >> android/gradle.properties <<EOF
          KINGX_UPLOAD_STORE_FILE=kingx-release.keystore
          KINGX_UPLOAD_STORE_PASSWORD=${KEYSTORE_PASSWORD}
          KINGX_UPLOAD_KEY_ALIAS=${KEY_ALIAS}
          KINGX_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}
          EOF

          echo "Signing properties configured."

      # ---------------------------------------------------------
      # 13. Configure release signing
      # ---------------------------------------------------------
      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "kingxRelease" not in text:
              marker = "android {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: Could not find android block in build.gradle"
                  )

              signing_block = r'''
              signingConfigs {
                  kingxRelease {
                      storeFile file(KINGX_UPLOAD_STORE_FILE)
                      storePassword KINGX_UPLOAD_STORE_PASSWORD
                      keyAlias KINGX_UPLOAD_KEY_ALIAS
                      keyPassword KINGX_UPLOAD_KEY_PASSWORD
                  }
              }

              '''

              text = text.replace(
                  marker,
                  marker + "\n" + signing_block,
                  1
              )

              path.write_text(text)

          print("Release signing configuration prepared.")
          PY

      # ---------------------------------------------------------
      # 14. Set release signing
      # ---------------------------------------------------------
      - name: Set release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "signingConfig signingConfigs.kingxRelease" not in text:
              release_marker = "release {"

              if release_marker not in text:
                  raise SystemExit(
                      "ERROR: Could not find release block in build.gradle"
                  )

              text = text.replace(
                  release_marker,
                  release_marker + "\n            signingConfig signingConfigs.kingxRelease",
                  1
              )

              path.write_text(text)

          print("Release signing attached.")
          PY

      # ---------------------------------------------------------
      # 15. Prepare Gradle
      # ---------------------------------------------------------
      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew --version

      # ---------------------------------------------------------
      # 16. Test JavaScript bundle
      # ---------------------------------------------------------
      - name: Test JavaScript bundle
        run: |
          npx expo export --platform android

      # ---------------------------------------------------------
      # 17. Build release APK
      # ---------------------------------------------------------
      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
            -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
        run: |
          set -o pipefail

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --max-workers=2 \
            2>&1 | tee ../gradle-build.log

      # ---------------------------------------------------------
      # 18. Verify APK
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      # ---------------------------------------------------------
      # 19. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: King-X-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 20. Upload Gradle log if build fails
      # ---------------------------------------------------------
      - name: Upload Gradle build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: King-X-gradle-debug-log
          path: |
            gradle-build.log
            android/app/build/outputs/**/*.log
          if-no-files-found: ignore