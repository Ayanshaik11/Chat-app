name: Build King X APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Node.js
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm


      # =========================================================
      # 3. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17


      # =========================================================
      # 4. Install dependencies
      # =========================================================
      - name: Install dependencies
        run: npm ci


      # =========================================================
      # 5. Check Expo dependencies
      # =========================================================
      - name: Verify Expo dependencies
        run: npx expo install --check


      # =========================================================
      # 6. Expo Doctor
      # =========================================================
      - name: Run Expo Doctor
        run: npx expo-doctor


      # =========================================================
      # 7. Restore Firebase configuration
      # =========================================================
      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is empty."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode \
            > google-services.json

          echo "Firebase file restored."

          echo "Validating Firebase JSON..."

          python3 -m json.tool \
            google-services.json \
            > /dev/null

          python3 - <<'PY'
          import json

          path = "google-services.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if "client" not in data:
              raise SystemExit("ERROR: Missing client")

          if not isinstance(data["client"], list):
              raise SystemExit("ERROR: client is not an array")

          if not data["client"]:
              raise SystemExit("ERROR: client array is empty")

          print("Firebase JSON validation: PASS")
          print("Client entries:", len(data["client"]))
          PY


      # =========================================================
      # 8. Generate Android project
      # =========================================================
      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --clean \
            --no-install


      # =========================================================
      # 9. Verify Android project
      # =========================================================
      - name: Verify Android project
        run: |
          set -e

          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/google-services.json

          echo "Android project verified."
          echo "Firebase configuration copied successfully."


      # =========================================================
      # 10. Remove root Firebase file
      # =========================================================
      - name: Remove Firebase source file
        run: |
          rm -f google-services.json

          if [ -f google-services.json ]; then
            echo "ERROR: Firebase source file still exists."
            exit 1
          fi

          echo "Root Firebase file removed."


      # =========================================================
      # 11. Restore release keystore
      # =========================================================
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/kingx-release.keystore

          if [ ! -s android/app/kingx-release.keystore ]; then
            echo "ERROR: Keystore was not restored."
            exit 1
          fi

          echo "Release keystore restored."


      # =========================================================
      # 12. Configure signing properties
      # =========================================================
      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is empty."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is empty."
            exit 1
          fi

          cat >> android/gradle.properties <<EOF
          KINGX_UPLOAD_STORE_FILE=kingx-release.keystore
          KINGX_UPLOAD_STORE_PASSWORD=${KEYSTORE_PASSWORD}
          KINGX_UPLOAD_KEY_ALIAS=${KEY_ALIAS}
          KINGX_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}
          EOF

          echo "Signing properties configured."


      # =========================================================
      # 13. Configure release signing
      # =========================================================
      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          marker = "android {"

          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not find android block in build.gradle"
              )

          # Add signing configuration only once.
          if "kingxRelease" not in text:
              signing_block = '''
              signingConfigs {
                  kingxRelease {
                      storeFile file(project.property("KINGX_UPLOAD_STORE_FILE"))
                      storePassword project.property("KINGX_UPLOAD_STORE_PASSWORD")
                      keyAlias project.property("KINGX_UPLOAD_KEY_ALIAS")
                      keyPassword project.property("KINGX_UPLOAD_KEY_PASSWORD")
                  }
              }

              '''

              text = text.replace(
                  marker,
                  marker + "\n" + signing_block,
                  1
              )

          # Attach signing configuration to release.
          release_marker = "release {"

          if release_marker not in text:
              raise SystemExit(
                  "ERROR: Could not find release block in build.gradle"
              )

          if "signingConfig signingConfigs.kingxRelease" not in text:
              text = text.replace(
                  release_marker,
                  release_marker +
                  "\n            signingConfig signingConfigs.kingxRelease",
                  1
              )

          path.write_text(text)

          print("Release signing configuration completed.")
          PY


      # =========================================================
      # 14. Prepare Gradle
      # =========================================================
      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version


      # =========================================================
      # 15. Test JavaScript bundle
      # =========================================================
      - name: Test JavaScript bundle
        run: |
          npx expo export --platform android


      # =========================================================
      # 16. Build release APK
      # =========================================================
      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
            -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
        run: |
          set -o pipefail

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --max-workers=2 \
            2>&1 | tee ../gradle-build.log


      # =========================================================
      # 17. Verify APK
      # =========================================================
      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."

            echo "Available build outputs:"
            find android/app/build/outputs \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo "======================================"
          echo "KING X APK SUCCESSFULLY GENERATED"
          echo "======================================"

          ls -lh "$APK_PATH"


      # =========================================================
      # 18. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: King-X-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


      # =========================================================
      # 19. Upload Gradle debug log on failure
      # =========================================================
      - name: Upload Gradle debug log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: King-X-gradle-debug-log
          path: |
            gradle-build.log
            android/app/build/outputs/**/*.log
          if-no-files-found: ignore