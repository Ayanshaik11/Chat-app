name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files and settings
        run: |
          for f in assets/icon.png keystore/debug.keystore src/config.js; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file: $f"
              exit 1
            fi
          done

          if grep -qE "YOUR_(API_KEY|PROJECT|SENDER_ID|APP_ID|WEB_CLIENT_ID)" src/config.js; then
            echo "::error::src/config.js still has placeholder values."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Align package versions with Expo SDK
        run: npx expo install --fix

      - name: Force Expo package versions
        run: node scripts/align-expo.js

      - name: Show installed package versions
        run: |
          {
            echo "### Installed package versions"
            echo '```'
            npm ls expo expo-modules-core expo-font expo-image-picker expo-video expo-audio expo-linear-gradient react-native firebase --all 2>&1 | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set signing key and Gradle settings
        run: |
          mkdir -p android/app
          cp keystore/debug.keystore android/app/debug.keystore
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chat-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Show APK SHA-1
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)

          "$APKSIGNER" verify --print-certs "$APK" | tee cert.txt

          {
            echo "### APK signing fingerprint"
            echo
            echo '```'
            grep -E "SHA-1|SHA-256" cert.txt
            echo '```'
            echo
            echo "Keystore fingerprint:"
            echo '```'
            keytool -list -v \
              -keystore keystore/debug.keystore \
              -storepass android \
              -alias androiddebugkey |
              grep -E "SHA1|SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
