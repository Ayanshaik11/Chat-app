name: Build King X APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/kingx-release.keystore

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF

          MYAPP_UPLOAD_STORE_FILE=kingx-release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Configure Gradle signing
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "signingConfigs" not in text:
              text = text.replace(
                  "buildTypes {",
                  """signingConfigs {
              release {
                  if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                      storeFile file(MYAPP_UPLOAD_STORE_FILE)
                      storePassword MYAPP_UPLOAD_STORE_PASSWORD
                      keyAlias MYAPP_UPLOAD_KEY_ALIAS
                      keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                  }
              }
          }

          buildTypes {""",
                  1
              )

          old = """release {
              // TODO: Add your own signing config for the release build.
              // Signing with the debug keys for now,
              // so `gradlew assembleRelease` works.
              signingConfig signingConfigs.debug
          }"""

          new = """release {
              signingConfig signingConfigs.release
          }"""

          if old in text:
              text = text.replace(old, new, 1)
          elif "signingConfig signingConfigs.debug" in text:
              text = text.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
                  1
              )

          path.write_text(text)
          PY

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: King-X-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error